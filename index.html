<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app.title">Zero Cycle Cheat Sheet</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply theme immediately to prevent flash
    (function() {
      const savedTheme = localStorage.getItem('zc-dark-mode');
      // Only add light-mode if explicitly set to 'false'
      if (savedTheme === 'false') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
</head>
<body>
  <!-- Settings Modal -->
  <div class="header">
    <div class="header-content">
      <h1><img src="favicon.png" alt="" style="height: 1.2em; vertical-align: middle; margin-right: 8px;"><span data-i18n="app.title">Zero Cycle Cheat Sheet</span></h1>
      <div class="header-buttons">
        <select class="lang-select" id="lang-select" data-i18n-aria="nav.language" aria-label="Language"></select>
        <label class="theme-toggle">
          <input type="checkbox" id="dark-mode-toggle" checked>
          <span class="toggle-slider"></span>
          <span class="theme-toggle-label" data-i18n="nav.dark_mode">Dark Mode</span>
        </label>
        <a href="info.html" class="header-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
          <span data-i18n="nav.info">Info</span>
        </a>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="tower-group">
        <div class="group-label" data-i18n="group.small">Small</div>
        <div class="tower-list" id="small-towers"></div>
      </div>
      <div class="tower-group">
        <div class="group-label" data-i18n="group.medium">Medium</div>
        <div class="tower-list" id="medium-towers"></div>
      </div>
      <div class="tower-group">
        <div class="group-label" data-i18n="group.tall">Tall</div>
        <div class="tower-list" id="tall-towers"></div>
      </div>
      <div class="tower-group">
        <div class="group-label" data-i18n="group.special">Special</div>
        <div class="tower-list" id="special-towers"></div>
      </div>
    </div>
    <div class="content">
      <div class="tower-header" id="tower-header"></div>
      <div id="tower-grid"></div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
